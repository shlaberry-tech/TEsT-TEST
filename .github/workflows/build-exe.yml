yaml
name: Build exe
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pandas numpy openpyxl tqdm
      - run: pyinstaller --onefile --console --name collections_report collections_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: collections_report
          path: dist/collections_report.exe
